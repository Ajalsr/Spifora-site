<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Spifora — Invitation</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{ --ink:#0b1220; --sub:#5b6472; --accent:#0d7a91; --accent-dark:#0a5f74; --accent-soft:#e7f3f5; --bg:#f8f6f1; --card:#ffffff; --line:#e7e3da; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .heading{font-family:Sora,sans-serif;font-weight:800;letter-spacing:-0.015em;}
  .card{max-width:400px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 32px;text-align:center;box-shadow:0 10px 28px rgba(11,18,32,.07);}
  .brand{display:flex;align-items:center;justify-content:center;gap:9px;font-size:19px;margin-bottom:22px;}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block;box-shadow:0 0 0 4px var(--accent-soft);}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);margin:0 auto 16px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  h1{font-size:19px;margin-bottom:8px;}
  p.sub{color:var(--sub);font-size:13.5px;margin-bottom:24px;line-height:1.6;}
  .btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer;border:none;margin-bottom:10px;transition:transform .15s,background .15s;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);}
  .btn-ghost{background:transparent;color:var(--sub);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--ink);}
</style>
</head>
<body>
  <div class="card">
    <div class="brand heading"><span class="dot"></span>Spifora</div>
    <div id="spin" class="spin"></div>
    <h1 class="heading" id="title">Opening Spifora Desktop…</h1>
    <p class="sub" id="sub">This invitation opens inside the desktop app, not the browser. If nothing happened, use the buttons below.</p>
    <button class="btn btn-primary" id="retryBtn" type="button">Open Spifora</button>
    <a class="btn btn-ghost" href="/download">Don't have it yet? Download Spifora</a>
  </div>

<script>
  // Marketing site has no backend to call — this page can't verify the
  // invitation itself, only hand off to the installed desktop app (which DOES
  // have a live local backend) via its spifora:// custom scheme. Harmless if
  // the app isn't installed: the OS just ignores the unknown protocol and the
  // buttons below stay usable.
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');

  function openApp() {
    if (!token) return;
    window.location.href = 'spifora://invitations/accept?token=' + encodeURIComponent(token);
  }

  if (!token) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('title').textContent = 'Missing invitation token';
    document.getElementById('sub').textContent = "This link is missing its invitation token — ask whoever invited you to resend it.";
    document.getElementById('retryBtn').style.display = 'none';
  } else {
    openApp();
  }
  document.getElementById('retryBtn').addEventListener('click', openApp);
</script>
</body>
</html>
